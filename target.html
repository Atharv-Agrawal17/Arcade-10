<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Target Striker | ARCADE 10</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:white;
    text-align:center;
    touch-action:manipulation;
}

header{
    padding:18px;
    background:#0b1d30;
    border-bottom:1px solid #294963;
}

header h1{
    margin:0;
    font-size:34px;
}

.subtitle{
    color:#9db5c8;
    margin-top:5px;
}

.game{
    max-width:750px;
    margin:auto;
    padding:15px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.stat{
    background:#10283e;
    padding:10px 22px;
    border-radius:15px;
    min-width:95px;
}

.stat strong{
    display:block;
    color:#ffd43b;
    font-size:24px;
}

.stat span{
    font-size:11px;
    color:#9db5c8;
}


/* TARGET AREA */

.arena{
    position:relative;
    width:min(94vw,650px);
    height:500px;
    margin:auto;
    overflow:hidden;

    background:
    radial-gradient(circle at center,#183c55,#071522 70%);

    border:4px solid #355b76;
    border-radius:25px;
}


/* TARGET */

.target{
    position:absolute;

    width:75px;
    height:75px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        white 0 12%,
        #e53935 13% 30%,
        white 31% 48%,
        #e53935 49% 70%,
        white 71% 100%
    );

    border:3px solid white;

    cursor:pointer;

    transform:scale(1);

    transition:
    transform .08s;

    box-shadow:
    0 0 20px rgba(255,255,255,.25);
}

.target:active{
    transform:scale(.8);
}


/* MESSAGE */

.message{
    min-height:30px;
    margin:12px;
    font-size:21px;
    font-weight:bold;
}


/* BUTTONS */

button{
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.start{
    background:#ffd43b;
    color:#111;
    padding:14px 30px;
    border-radius:25px;
    font-size:16px;
}

.back{
    display:block;
    margin:15px;
    color:#ffd43b;
    text-decoration:none;
}


/* MOBILE */

@media(max-width:600px){

    .arena{
        height:440px;
    }

    .target{
        width:65px;
        height:65px;
    }

}

</style>

</head>


<body>


<header>

<h1>🎯 TARGET STRIKER</h1>

<div class="subtitle">
ARCADE 10 • GAME 04
</div>

</header>


<main class="game">


<!-- STATS -->

<div class="stats">

<div class="stat">

<strong id="score">
0
</strong>

<span>SCORE</span>

</div>


<div class="stat">

<strong id="hits">
0
</strong>

<span>HITS</span>

</div>


<div class="stat">

<strong id="time">
30
</strong>

<span>SECONDS</span>

</div>


<div class="stat">

<strong id="level">
1
</strong>

<span>LEVEL</span>

</div>

</div>



<!-- ARENA -->

<div
class="arena"
id="arena">

</div>



<div
class="message"
id="message">

Hit START and destroy the targets!

</div>



<button
class="start"
id="startButton"
onclick="startGame()">

START GAME

</button>


<a
class="back"
href="index.html">

← Back to ARCADE 10

</a>


</main>



<script>


const arena =
document.getElementById("arena");

const scoreText =
document.getElementById("score");

const hitsText =
document.getElementById("hits");

const timeText =
document.getElementById("time");

const levelText =
document.getElementById("level");

const message =
document.getElementById("message");

const startButton =
document.getElementById("startButton");


let score = 0;

let hits = 0;

let time = 30;

let level = 1;

let playing = false;

let timer;

let targetTimer;



function startGame(){

    if(playing) return;

    score = 0;
    hits = 0;
    time = 30;
    level = 1;

    playing = true;

    scoreText.textContent = score;
    hitsText.textContent = hits;
    timeText.textContent = time;
    levelText.textContent = level;

    message.textContent =
    "🎯 HIT AS MANY AS YOU CAN!";

    startButton.textContent =
    "PLAYING...";

    clearArena();

    createTarget();

    timer =
    setInterval(updateTime,1000);

}



function updateTime(){

    time--;

    timeText.textContent = time;


    if(time <= 0){

        endGame();

        return;

    }


    /*
    LEVEL UP EVERY 5 HITS
    */

    let newLevel =
    Math.min(
        3,
        Math.floor(hits / 5) + 1
    );


    if(newLevel !== level){

        level = newLevel;

        levelText.textContent =
        level;

        message.textContent =
        "🔥 LEVEL " + level + "!";

    }

}



function createTarget(){

    if(!playing) return;


    clearTimeout(targetTimer);


    const old =
    document.querySelector(".target");


    if(old){
        old.remove();
    }


    const target =
    document.createElement("div");


    target.className =
    "target";


    /*
    RANDOM POSITION
    */

    const maxX =
    arena.clientWidth - 90;

    const maxY =
    arena.clientHeight - 90;


    const x =
    Math.random() * maxX + 5;

    const y =
    Math.random() * maxY + 5;


    target.style.left =
    x + "px";

    target.style.top =
    y + "px";


    target.onclick =
    function(event){

        event.stopPropagation();

        hitTarget(target);

    };


    arena.appendChild(target);


    /*
    TARGET DISAPPEARS
    FASTER AT HIGHER LEVELS
    */

    const targetTime =
    Math.max(
        450,
        1100 - level * 180
    );


    targetTimer =
    setTimeout(function(){

        if(playing){

            target.remove();

            message.textContent =
            "❌ Too slow!";

            createTarget();

        }

    },targetTime);

}



function hitTarget(target){

    if(!playing) return;


    clearTimeout(targetTimer);


    target.remove();


    hits++;


    let points =
    100 * level;


    score += points;


    hitsText.textContent =
    hits;

    scoreText.textContent =
    score;


    message.textContent =
    "🎯 HIT! +" + points;


    /*
    LEVEL UP
    */

    let newLevel =
    Math.min(
        3,
        Math.floor(hits / 5) + 1
    );


    if(newLevel !== level){

        level = newLevel;

        levelText.textContent =
        level;

        message.textContent =
        "🔥 LEVEL " + level + "!";

    }


    createTarget();

}



function clearArena(){

    const targets =
    document.querySelectorAll(".target");


    targets.forEach(function(target){

        target.remove();

    });

}



function endGame(){

    playing = false;


    clearInterval(timer);

    clearTimeout(targetTimer);

    clearArena();


    startButton.textContent =
    "PLAY AGAIN";


    message.textContent =
    "🏆 GAME OVER — SCORE: " + score;


    saveScore();

}



function saveScore(){

    const oldScore =
    Number(
        localStorage.getItem("arcade10Score")
    ) || 0;


    if(score > oldScore){

        localStorage.setItem(
            "arcade10Score",
            score
        );

    }

}


</script>


</body>

</html>
