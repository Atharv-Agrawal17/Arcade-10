<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sports Quiz | ARCADE 10</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:white;
    min-height:100vh;
    text-align:center;
}

header{
    padding:20px;
    background:#0b1d30;
    border-bottom:1px solid #294963;
}

header h1{
    margin:0;
    font-size:36px;
}

.subtitle{
    color:#9db5c8;
    margin-top:5px;
}

.game{
    max-width:800px;
    margin:auto;
    padding:25px 15px;
}


/* STATS */

.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.stat{
    background:#10283e;
    padding:12px 25px;
    border-radius:15px;
    min-width:100px;
}

.stat strong{
    display:block;
    color:#ffd43b;
    font-size:25px;
}

.stat span{
    font-size:11px;
    color:#9db5c8;
}


/* LEVELS */

.level-select{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.level-button{
    border:none;
    padding:12px 22px;
    border-radius:22px;
    background:#17344c;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.level-button.active{
    background:#ffd43b;
    color:#111;
}


/* QUIZ CARD */

.quiz-card{
    background:
    linear-gradient(
        145deg,
        #12283d,
        #091827
    );

    border:1px solid #284962;

    border-radius:25px;

    padding:35px 25px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.25);
}

.question-number{
    color:#ffd43b;
    font-weight:bold;
    margin-bottom:15px;
}

.question{
    font-size:27px;
    line-height:1.35;
    margin-bottom:25px;
}


/* ANSWERS */

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.answer{
    border:none;
    padding:17px;
    border-radius:16px;
    background:#17344c;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.answer:hover{
    background:#244b68;
    transform:translateY(-2px);
}

.answer.correct{
    background:#238636;
}

.answer.wrong{
    background:#b42323;
}


/* MESSAGE */

.message{
    min-height:30px;
    margin:20px;
    font-size:19px;
    font-weight:bold;
}


/* BUTTON */

.start{
    border:none;
    padding:14px 30px;
    border-radius:25px;
    background:#ffd43b;
    color:#111;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    display:block;
    margin:20px;
    color:#ffd43b;
    text-decoration:none;
}


/* MOBILE */

@media(max-width:600px){

    .answers{
        grid-template-columns:1fr;
    }

    .question{
        font-size:22px;
    }

}

</style>

</head>


<body>


<header>

<h1>🧠 SPORTS QUIZ</h1>

<div class="subtitle">
ARCADE 10 • GAME 06
</div>

</header>


<main class="game">


<!-- STATS -->

<div class="stats">

<div class="stat">

<strong id="score">
0
</strong>

<span>SCORE</span>

</div>


<div class="stat">

<strong id="questionNumber">
1
</strong>

<span>QUESTION</span>

</div>


<div class="stat">

<strong id="timer">
15
</strong>

<span>SECONDS</span>

</div>


<div class="stat">

<strong id="levelText">
EASY
</strong>

<span>LEVEL</span>

</div>

</div>



<!-- LEVEL SELECT -->

<div class="level-select">

<button
class="level-button active"
onclick="setLevel('easy',this)">

EASY

</button>


<button
class="level-button"
onclick="setLevel('medium',this)">

MEDIUM

</button>


<button
class="level-button"
onclick="setLevel('hard',this)">

HARD

</button>

</div>



<!-- QUIZ -->

<div class="quiz-card">

<div
class="question-number"
id="questionNumberText">

QUESTION 1

</div>


<div
class="question"
id="question">

Press START to begin!

</div>


<div
class="answers"
id="answers">

</div>


<div
class="message"
id="message">

Choose a difficulty and start!

</div>


<button
class="start"
id="startButton"
onclick="startQuiz()">

START QUIZ

</button>

</div>



<a
class="back"
href="index.html">

← Back to ARCADE 10

</a>


</main>



<script>


/* QUESTIONS */


const questions = {

easy: [

{
q:"How many players are on a football team on the field?",
a:[
"9",
"10",
"11",
"12"
],
correct:2
},

{
q:"Which sport uses a hoop and a basketball?",
a:[
"Football",
"Basketball",
"Tennis",
"Golf"
],
correct:1
},

{
q:"What color card means a player is sent off in football?",
a:[
"Yellow",
"Blue",
"Red",
"Green"
],
correct:2
},

{
q:"How many rings are on the Olympic symbol?",
a:[
"4",
"5",
"6",
"7"
],
correct:1
},

{
q:"Which sport is played at Wimbledon?",
a:[
"Tennis",
"Golf",
"Rugby",
"Swimming"
],
correct:0
}

],


medium: [

{
q:"How long is a standard football match, excluding added time?",
a:[
"60 minutes",
"75 minutes",
"90 minutes",
"120 minutes"
],
correct:2
},

{
q:"In basketball, how many points is a free throw worth?",
a:[
"1",
"2",
"3",
"4"
],
correct:0
},

{
q:"Which country hosted the first modern Olympic Games in 1896?",
a:[
"France",
"Greece",
"Italy",
"USA"
],
correct:1
},

{
q:"How many Grand Slam tennis tournaments are there each year?",
a:[
"2",
"3",
"4",
"5"
],
correct:2
},

{
q:"In which sport would you perform a slam dunk?",
a:[
"Tennis",
"Basketball",
"Volleyball",
"Baseball"
],
correct:1
}

],


hard: [

{
q:"Which country has won the most FIFA World Cups?",
a:[
"Germany",
"Argentina",
"Brazil",
"Italy"
],
correct:2
},

{
q:"How many points is a touchdown worth in American football before the extra point?",
a:[
"3",
"5",
"6",
"7"
],
correct:2
},

{
q:"Which Grand Slam tennis tournament is played on clay?",
a:[
"Wimbledon",
"US Open",
"French Open",
"Australian Open"
],
correct:2
},

{
q:"In athletics, how many lanes are commonly used in an Olympic 100m final?",
a:[
"6",
"7",
"8",
"10"
],
correct:2
},

{
q:"Which country won the men's football tournament at the 2024 Paris Olympics?",
a:[
"France",
"Spain",
"Argentina",
"Brazil"
],
correct:0
}

]

};


let level = "easy";

let currentQuestions = [];

let current = 0;

let score = 0;

let time = 15;

let timer;

let playing = false;


const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const message =
document.getElementById("message");

const scoreText =
document.getElementById("score");

const timerText =
document.getElementById("timer");

const questionNumber =
document.getElementById("questionNumber");

const questionNumberText =
document.getElementById("questionNumberText");

const levelText =
document.getElementById("levelText");

const startButton =
document.getElementById("startButton");



function setLevel(newLevel,button){

    if(playing) return;

    level = newLevel;

    document
    .querySelectorAll(".level-button")
    .forEach(function(btn){

        btn.classList.remove("active");

    });

    button.classList.add("active");

    levelText.textContent =
    level.toUpperCase();

}



function startQuiz(){

    currentQuestions =
    [...questions[level]];

    current = 0;

    score = 0;

    playing = true;

    scoreText.textContent =
    score;

    startButton.style.display =
    "none";

    message.textContent =
    "Good luck! 🧠";

    showQuestion();

}



function showQuestion(){

    clearInterval(timer);

    if(current >= currentQuestions.length){

        endQuiz();

        return;

    }


    const q =
    currentQuestions[current];


    questionNumber.textContent =
    current + 1;

    questionNumberText.textContent =
    "QUESTION " +
    (current + 1);


    question.textContent =
    q.q;


    answers.innerHTML =
    "";


    q.a.forEach(function(answer,index){

        const button =
        document.createElement("button");

        button.className =
        "answer";

        button.textContent =
        answer;

        button.onclick =
        function(){

            checkAnswer(index,button);

        };

        answers.appendChild(button);

    });


    time = 15;

    timerText.textContent =
    time;


    timer =
    setInterval(function(){

        time--;

        timerText.textContent =
        time;


        if(time <= 0){

            clearInterval(timer);

            message.textContent =
            "⏰ TIME'S UP!";

            disableAnswers();

            setTimeout(function(){

                current++;

                showQuestion();

            },900);

        }

    },1000);

}



function checkAnswer(index,button){

    clearInterval(timer);

    const correct =
    currentQuestions[current].correct;


    disableAnswers();


    if(index === correct){

        button.classList.add("correct");

        let points =
        level === "easy"
        ? 100
        : level === "medium"
        ? 150
        : 200;


        score += points;

        scoreText.textContent =
        score;

        message.textContent =
        "✅ CORRECT! +" +
        points;

    }

    else{

        button.classList.add("wrong");

        message.textContent =
        "❌ WRONG!";

        const all =
        document.querySelectorAll(".answer");

        all[correct].classList.add(
            "correct"
        );

    }


    setTimeout(function(){

        current++;

        showQuestion();

    },1000);

}



function disableAnswers(){

    document
    .querySelectorAll(".answer")
    .forEach(function(button){

        button.disabled = true;

    });

}



function endQuiz(){

    playing = false;

    clearInterval(timer);

    question.textContent =
    "🏆 QUIZ COMPLETE!";

    answers.innerHTML =
    "";

    questionNumberText.textContent =
    "FINAL RESULT";

    message.textContent =
    "You scored " +
    score +
    " points!";

    startButton.style.display =
    "inline-block";

    startButton.textContent =
    "PLAY AGAIN";

    saveScore();

}



function saveScore(){

    const oldScore =
    Number(
        localStorage.getItem("arcade10Score")
    ) || 0;


    if(score > oldScore){

        localStorage.setItem(
            "arcade10Score",
            score
        );

    }

}


</script>


</body>

</html>
