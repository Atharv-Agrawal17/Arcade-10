<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Hoop Challenge | ARCADE 10</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:white;
    text-align:center;
    touch-action:none;
}

header{
    padding:18px;
    background:#0b1d30;
    border-bottom:1px solid #294963;
}

header h1{
    margin:0;
    font-size:34px;
}

.subtitle{
    color:#9db5c8;
    margin-top:5px;
}

.game{
    max-width:800px;
    margin:auto;
    padding:15px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#10283e;
    padding:10px 22px;
    border-radius:15px;
    min-width:90px;
}

.stat strong{
    display:block;
    color:#ffd43b;
    font-size:24px;
}

.stat span{
    font-size:11px;
    color:#9db5c8;
}


/* COURT */

.court{
    position:relative;
    width:min(94vw,650px);
    height:500px;
    margin:auto;
    overflow:hidden;
    border-radius:25px;
    border:4px solid white;

    background:
    linear-gradient(
        to bottom,
        #b86d35 0%,
        #a95f2c 100%
    );
}


/* COURT LINES */

.court::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border:4px solid rgba(255,255,255,.6);
    border-radius:50%;
    left:50%;
    top:230px;
    transform:translateX(-50%);
}

.court::after{
    content:"";
    position:absolute;
    left:15%;
    right:15%;
    top:90px;
    height:260px;
    border:4px solid rgba(255,255,255,.6);
    border-bottom:none;
}


/* HOOP */

.backboard{
    position:absolute;
    top:35px;
    left:50%;
    transform:translateX(-50%);
    width:150px;
    height:75px;
    background:#e9f4ff;
    border:5px solid white;
    border-radius:5px;
    z-index:3;
}

.rim{
    position:absolute;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    width:95px;
    height:25px;
    border:7px solid #ff5722;
    border-radius:50%;
    z-index:4;
}

.net{
    position:absolute;
    top:113px;
    left:50%;
    transform:translateX(-50%);
    width:75px;
    height:65px;
    border-left:3px dashed white;
    border-right:3px dashed white;
    border-bottom:3px dashed white;
    border-radius:0 0 35px 35px;
    opacity:.8;
    z-index:3;
}


/* BALL */

.ball{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#f47c20;
    border:3px solid #111;
    left:calc(50% - 24px);
    bottom:35px;
    z-index:8;
    cursor:pointer;
    transition:
        left .25s,
        bottom .45s,
        transform .45s;
}

.ball::before{
    content:"";
    position:absolute;
    width:45px;
    height:2px;
    background:#111;
    top:20px;
    left:0;
    transform:rotate(45deg);
}

.ball::after{
    content:"";
    position:absolute;
    width:45px;
    height:2px;
    background:#111;
    top:20px;
    left:0;
    transform:rotate(-45deg);
}


/* MESSAGE */

.message{
    min-height:32px;
    margin:12px;
    font-size:22px;
    font-weight:bold;
}


/* CONTROLS */

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.controls button{
    border:none;
    background:#ffd43b;
    color:#111;
    padding:14px 22px;
    border-radius:25px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.controls button:active{
    transform:scale(.94);
}

.start{
    margin-top:10px;
    background:#1c3953 !important;
    color:white !important;
}


/* BACK */

.back{
    display:block;
    margin:15px;
    color:#ffd43b;
    text-decoration:none;
}


/* MOBILE */

@media(max-width:600px){

    .court{
        height:450px;
    }

    .backboard{
        top:25px;
    }

    .rim{
        top:85px;
    }

    .net{
        top:103px;
    }

}

</style>

</head>


<body>


<header>

<h1>🏀 HOOP CHALLENGE</h1>

<div class="subtitle">
ARCADE 10 • GAME 03
</div>

</header>


<main class="game">


<!-- STATS -->

<div class="stats">

<div class="stat">

<strong id="score">
0
</strong>

<span>SCORE</span>

</div>


<div class="stat">

<strong id="shots">
10
</strong>

<span>SHOTS</span>

</div>


<div class="stat">

<strong id="level">
1
</strong>

<span>LEVEL</span>

</div>

</div>



<!-- COURT -->

<div class="court" id="court">

<div class="backboard"></div>

<div class="rim"></div>

<div class="net"></div>

<div
class="ball"
id="ball"
onclick="shoot()">
</div>

</div>



<div
class="message"
id="message">

Tap a direction and shoot!

</div>



<!-- CONTROLS -->

<div class="controls">

<button onclick="shoot('left')">
⬅️ LEFT
</button>

<button onclick="shoot('center')">
🏀 SHOOT
</button>

<button onclick="shoot('right')">
➡️ RIGHT
</button>

</div>


<button
class="controls button start"
onclick="restartGame()"
style="
border:none;
padding:13px 25px;
border-radius:25px;
margin-top:12px;
background:#1c3953;
color:white;
font-weight:bold;
">

RESTART

</button>


<a
class="back"
href="index.html">

← Back to ARCADE 10

</a>


</main>



<script>


let score = 0;

let shots = 10;

let level = 1;

let busy = false;


const ball =
document.getElementById("ball");

const message =
document.getElementById("message");

const scoreText =
document.getElementById("score");

const shotsText =
document.getElementById("shots");

const levelText =
document.getElementById("level");



function shoot(direction){

    if(busy) return;

    if(shots <= 0){

        message.textContent =
        "🏆 FINAL SCORE: " + score;

        return;
    }


    if(!direction){

        direction =
        ["left","center","right"]
        [Math.floor(Math.random()*3)];

    }


    busy = true;

    shots--;

    shotsText.textContent =
    shots;


    /* BALL POSITION */

    if(direction === "left"){

        ball.style.left =
        "25%";

    }

    else if(direction === "right"){

        ball.style.left =
        "75%";

    }

    else{

        ball.style.left =
        "calc(50% - 24px)";

    }


    ball.style.bottom =
    "310px";

    ball.style.transform =
    "rotate(720deg)";


    setTimeout(function(){

        /*
        CENTER = BEST SHOT
        SIDE SHOTS HAVE SMALLER CHANCE
        */

        let chance =
        direction === "center"
        ? .85
        : .55;


        let made =
        Math.random() < chance;


        if(made){

            let points =
            100 * level;

            score += points;

            scoreText.textContent =
            score;

            message.textContent =
            "🏀 SWISH! +" + points;


            if(
                score >= level * 300 &&
                level < 3
            ){

                level++;

                levelText.textContent =
                level;

                setTimeout(function(){

                    message.textContent =
                    "🔥 LEVEL " + level + "!";

                },600);

            }

        }

        else{

            message.textContent =
            "❌ MISS!";

        }


        setTimeout(resetBall,700);

    },450);

}



function resetBall(){

    ball.style.left =
    "calc(50% - 24px)";

    ball.style.bottom =
    "35px";

    ball.style.transform =
    "rotate(0deg)";

    busy = false;


    if(shots === 0){

        setTimeout(function(){

            message.textContent =
            "🏆 FINAL SCORE: " + score;

            saveScore();

        },500);

    }

}



function restartGame(){

    score = 0;

    shots = 10;

    level = 1;

    busy = false;

    scoreText.textContent =
    score;

    shotsText.textContent =
    shots;

    levelText.textContent =
    level;

    message.textContent =
    "Tap a direction and shoot!";

    ball.style.left =
    "calc(50% - 24px)";

    ball.style.bottom =
    "35px";

    ball.style.transform =
    "rotate(0deg)";

}



function saveScore(){

    let oldScore =
    Number(
        localStorage.getItem("arcade10Score")
    ) || 0;


    if(score > oldScore){

        localStorage.setItem(
            "arcade10Score",
            score
        );

    }

}


</script>


</body>

</html>
